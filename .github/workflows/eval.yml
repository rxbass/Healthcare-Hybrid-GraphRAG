# Golden-set evaluation in CI (DESIGN.md section 7): every push/PR runs the
# offline unit tests and the deterministic Stage 1 retrieval check against the
# graph. Stage 2 (LLM judge) costs money and is run on demand or nightly.
#
# Secrets required in the repository settings (never in code):
#   NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD   -> Stage 1 + integration tests
#   OPENAI_API_KEY                              -> Stage 2 / integration tests only
name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stage2:
        description: "Also run Stage 2 (LLM judge)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: Stage 1 + Stage 2

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # spaCy model is only needed by the live guardrail tests, which skip without secrets
      - run: python -m pytest -q --ignore=tests/test_guardrails_integration.py --ignore=tests/test_retrieval_integration.py

  stage1:
    name: stage 1 — deterministic retrieval check
    runs-on: ubuntu-latest
    needs: unit
    # forks have no secrets: skip instead of failing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}   # Aura instances often name the database after the instance id; empty -> 'neo4j'
    steps:
      # Job-level `if` cannot read secrets, so detect them in a step and gate the rest on it.
      - name: Check for Neo4j secrets
        id: secrets
        run: |
          missing=""
          for v in NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -z "$NEO4J_URI" ] && [ -z "$NEO4J_USERNAME" ] && [ -z "$NEO4J_PASSWORD" ]; then
            echo "::warning title=Stage 1 skipped::No Neo4j repository secrets configured (NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD), so the deterministic retrieval check cannot run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error title=Stage 1 misconfigured::Repository secret(s) missing:$missing — the secret names must match exactly (note: NEO4J_USERNAME, not NEO4J_USER)."
            exit 1
          else
            echo "All three Neo4j secrets present (URI scheme: ${NEO4J_URI%%://*}://…)"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.secrets.outputs.present == 'true'
      - name: Stage 1 (fails the build below 100% pass)
        if: steps.secrets.outputs.present == 'true'
        run: python eval/run_eval.py --stage 1 --min-pass 1.0
      - uses: actions/upload-artifact@v7
        if: always() && steps.secrets.outputs.present == 'true'
        with:
          name: stage1-results
          path: eval/results/stage1_latest.*

  stage2:
    name: stage 2 — LLM judge
    runs-on: ubuntu-latest
    needs: stage1
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage2)
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}   # Aura instances often name the database after the instance id; empty -> 'neo4j'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      JUDGE_MODEL: ${{ secrets.JUDGE_MODEL || 'gpt-4o' }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'text-embedding-3-small' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_lg
      - name: Stage 2 (fails below 85% pass)
        run: python eval/run_eval.py --stage 2 --min-pass 0.85
      - run: python eval/report.py --md eval/results/ops_latest.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage2-results
          path: |
            eval/results/stage2_latest.*
            eval/results/ops_latest.md
